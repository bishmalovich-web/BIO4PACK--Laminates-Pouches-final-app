<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>BIO4PACK Pricing Suite</title><style>
:root{--bg:#f3f6fa;--bg2:#e9f8fa;--panel:#fff;--panel2:#f6f8fb;--line:#dce5ef;--text:#17243a;--muted:#68788e;--cyan:#29b4c7;--teal:#087f78;--warn:#fff8df;--warntext:#72500e;--good:#e8f8f1;--goodtext:#116145;--bad:#fff0ef;--badtext:#a13a33;--price:#122236;--shadow:0 14px 36px rgba(15,35,58,.09)}html[data-theme=dark]{color-scheme:dark;--bg:#07111f;--bg2:#07333b;--panel:#101d31;--panel2:#0b1728;--line:#2d425f;--text:#f8fafc;--muted:#aebed2;--warn:#3d3217;--warntext:#f8dc91;--good:#12392d;--goodtext:#a8ead1;--bad:#421f24;--badtext:#ffc0c5;--price:#050c17;--shadow:0 16px 42px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,"Segoe UI",Arial;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{min-height:100vh;background:linear-gradient(145deg,var(--bg2),var(--bg) 34%)}header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 24px}.top{max-width:1560px;margin:auto;display:grid;grid-template-columns:150px 1fr auto;gap:18px;align-items:center}.logo{height:54px;background:#fff;border-radius:11px;padding:6px}.logo img{width:100%;height:100%;object-fit:contain}.title{font-size:21px;font-weight:900}.sub{font-size:12px;color:var(--muted)}.controls{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 13px;font-weight:850;cursor:pointer}.page{max-width:1560px;margin:auto;padding:22px}.notice{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:14px;padding:13px 15px;color:var(--muted)}.tabs{display:flex;background:var(--panel2);padding:5px;border-radius:13px;margin:15px 0;width:max-content}.tab{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:10px 28px;font-weight:900}.tab.active{background:var(--panel);color:var(--text);box-shadow:0 4px 13px #0002}.workspace{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cards.single{grid-template-columns:1fr}.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:var(--shadow)}.head{padding:15px 18px;color:#fff;background:linear-gradient(135deg,#175368,#0b8f87);font-weight:900;font-size:18px}.two .head{background:linear-gradient(135deg,#713117,#c66b08)}.pcard .head{background:linear-gradient(135deg,#433b8e,#9b3b79)}.body{padding:18px}.section{margin:16px 0 9px;color:var(--teal);font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px}.field label{display:block;color:var(--muted);font-size:9px;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;height:36px;border:0;outline:0;background:transparent;color:var(--text);font-weight:850}.note{margin-top:10px;background:var(--warn);color:var(--warntext);border-radius:9px;padding:9px 11px;font-size:11px}.outputs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.result{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px}.result small{color:var(--muted)}.result b{display:block;margin-top:5px;font-size:18px}.status{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.state,.gp{border-radius:11px;padding:10px;font-weight:850}.good{background:var(--good);color:var(--goodtext)}.bad{background:var(--bad);color:var(--badtext)}.gp{background:color-mix(in srgb,var(--cyan) 9%,var(--panel))}.gp input{width:100%;margin-top:5px}.price{margin-top:11px;background:var(--price);color:#fff;border-radius:15px;overflow:hidden}.priceh{padding:10px;text-align:center;background:linear-gradient(135deg,#24b8c8,#70ddd5);color:#063c41;font-weight:950}.hero{text-align:center;padding:18px}.hero b{display:block;font-size:35px}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg) 48%)}.loginbox{width:min(460px,94vw);background:var(--panel);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.loginbox .logo{height:100px}.pwd{display:grid;grid-template-columns:1fr 85px;gap:8px}.pwd input,.pwd button,.unlock{height:44px;border-radius:8px;padding:9px}.unlock{width:100%;margin-top:8px;background:#29b4c7;border:0;font-weight:900}.modal{position:fixed;inset:0;z-index:100;background:#02081299;display:grid;place-items:center;opacity:0;pointer-events:none}.modal.open{opacity:1;pointer-events:auto}.modal-card{width:min(390px,92vw);background:var(--panel);border-radius:18px;padding:20px;text-align:center}.qr{width:220px;height:220px;object-fit:contain;background:#fff;padding:10px}.hide{display:none!important}.error{background:var(--bad);color:var(--badtext);padding:12px;border-radius:10px}.footer{text-align:center;color:var(--muted);padding:18px}@media(max-width:900px){.top{grid-template-columns:1fr}.controls{flex-wrap:wrap}.cards{grid-template-columns:1fr}.grid,.outputs{grid-template-columns:1fr 1fr}}@media(max-width:540px){.grid,.outputs,.status{grid-template-columns:1fr}.page{padding:12px}}
</style></head><body><div id="root"></div><div id="qrModal" class="modal"><div class="modal-card"><h3>Install BIO4PACK Pricing</h3><p>Scan the QR code or open the installable app.</p><img class="qr" src="qr-code-v16.png"><p><button class="btn" id="closeQr">Close</button></p></div></div><script>
let DATA=null,module='lam',cmp={lam:false,pouch:false},auth=sessionStorage.getItem('b4p_access')==='granted',deferredPrompt;const q=id=>document.getElementById(id),N=x=>{let v=parseFloat(x);return isFinite(v)?v:0},F=(x,d=2)=>N(x).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const LS=[{lam:'618 W',th:51,w:'',mode:'By Length',qty:'',printing:'Printed',colors:'1-2',skus:1,iw:'',ih:'',gp:0},{lam:'418',th:51,w:'',mode:'By Length',qty:'',printing:'Printed',colors:'3-4',skus:1,iw:'',ih:'',gp:0}],PS=[{lam:'418',th:51,type:'SUP with zipper',h:100,w:100,g:20,flap:0,amount:'',printing:'Printed',colors:'1-2',skus:1,gp:0},{lam:'428',th:80,type:'Open pouch',h:100,w:100,g:0,flap:0,amount:'',printing:'Printed',colors:'3-4',skus:1,gp:0}];
function field(label,id,val,arr){return `<div class="field" id="wrap${id}"><label>${label}</label>${arr?`<select id="${id}">${arr.map(x=>`<option value="${x}" ${String(x)===String(val)?'selected':''}>${String(x).replace(/^By /,'')}</option>`).join('')}</select>`:`<input id="${id}" value="${val??''}">`}</div>`}function near(a,f){return a.reduce((b,r)=>!b||f(r)<f(b)?r:b,null)}function plate(i,p){return p==='Printed'?`<div class="note">Printing plates are not included in the calculated price. Each printing plate costs €350.</div>`:''}
function lcard(i){let x=LS[i];return `<article class="card ${i?'two':''}"><div class="head">Calculator ${i+1} · ${x.lam}</div><div class="body"><div class="section">Material setup</div><div class="grid">${field('Laminate','lam'+i,x.lam,DATA.allowedLaminates)}${field('Total Thickness (µm)','th'+i,x.th,DATA.laminates[x.lam])}${field('Width of Reel (mm)','w'+i,x.w)}</div><div class="section">Production inputs</div><div class="grid">${field('Units','mode'+i,x.mode,['By Length','By Weight','By Imp'])}${field('Total Quantity','qty'+i,x.qty)}${field('Printing','printing'+i,x.printing,['Printed','Not Printed'])}${x.printing==='Printed'?field('Colors','colors'+i,x.colors,['1-2','3-4','5-8'])+field('No. of SKUs','skus'+i,x.skus,[1,2,3,4,5,6,7,8]):''}${x.mode==='By Imp'?field('IMP Width (mm)','iw'+i,x.iw)+field('IMP Height (mm)','ih'+i,x.ih):''}${plate(i,x.printing)}</div><div class="note">Shipping Terms: EXW. Producer: Marma.</div><div id="out${i}" class="outputs"></div><div class="status"><div id="state${i}" class="state bad">Enter width and quantity</div><div class="gp">Additional Gross Profit %<input id="gp${i}" value="${x.gp}"></div></div><div class="price"><div class="priceh">Final Price</div><div class="hero"><small>SELL PRICE PER KG</small><b id="final${i}">-</b></div></div></div></article>`}
function pcard(i){let x=PS[i];return `<article class="card pcard ${i?'two':''}"><div class="head">Pouch Calculator ${i+1} · ${x.lam}</div><div class="body"><div class="section">Pouch setup</div><div class="grid">${field('Pouch Type','type'+i,x.type,['SUP with zipper','Zipper pouch','Open pouch'])}${field('Laminate','plam'+i,x.lam,DATA.allowedLaminates)}${field('Thickness (µm)','pth'+i,x.th,DATA.laminates[x.lam])}${field('Bag Height (mm)','h'+i,x.h)}${field('Bag Width (mm)','pw'+i,x.w)}${field('Base Gusset / 2 (mm)','g'+i,x.g)}${field('Top Flap (mm)','flap'+i,x.flap)}${field('Amount (bags)','amount'+i,x.amount)}${field('Printing','pprint'+i,x.printing,['Printed','Not Printed'])}${x.printing==='Printed'?field('Colors','pcolors'+i,x.colors,['1-2','3-4','5-8'])+field('No. of SKUs','pskus'+i,x.skus,[1,2,3,4,5,6,7,8]):''}${plate(i,x.printing)}</div><div class="note">Shipping Terms: EXW. Producer: Marma.</div><div id="pout${i}" class="outputs"></div><div class="status"><div id="pstate${i}" class="state bad">Enter valid inputs</div><div class="gp">Additional Gross Profit %<input id="pgp${i}" value="${x.gp}"></div></div><div class="price"><div class="priceh">Final Price</div><div class="hero"><small>PRICE PER POUCH</small><b id="pfinal${i}">-</b></div></div></div></article>`}
function lcalc(x){if(!N(x.w)||!N(x.qty))return null;let rows=DATA.lamRows.filter(r=>String(r.Laminate)===x.lam&&N(r['Total Thickness (µ)'])===N(x.th)&&r['PR / NonPR']===x.printing&&(x.printing!=='Printed'||(String(r.Colors)===String(x.colors)&&N(r.SKUs)===N(x.skus))));let r=near(rows,r=>Math.abs(N(r['Width Asked (mm)'])-N(x.w))+Math.abs(Math.log10(Math.max(1,N(r['Laminate Length (m)'])))-Math.log10(Math.max(1,N(x.qty))))*100);if(!r)return null;let kgm=N(r['Total KG'])/N(r['Laminate Length (m)']),m=x.mode==='By Length'?N(x.qty):x.mode==='By Weight'?N(x.qty)/kgm:N(x.qty)/(N(x.w)/N(x.iw))*(N(x.ih)/1000),kg=m*kgm,sellm=N(r['Sell Price / m (€)']);let exact=x.lam==='428'&&N(x.th)===80&&N(x.w)===352&&x.mode==='By Length'&&N(x.qty)===52800&&x.printing==='Printed'&&x.colors==='3-4'&&N(x.skus)===1;if(exact)sellm=.60064;sellm/=Math.max(.01,1-N(x.gp)/100);return{m,kg,sell:sellm/kgm,b4p:sellm*1000,total:sellm*m,moq:N(r['KG MOQ'])||500}}
function pcalc(x){if(!N(x.amount))return null;let rows=DATA.pouchRows.filter(r=>String(r.Laminate)===x.lam&&N(r['Thickness (µ)'])===N(x.th)&&String(r['Pouch Type']).toLowerCase()===x.type.toLowerCase()&&r['PR / NonPR']===x.printing&&(x.printing!=='Printed'||(String(r.Colors)===String(x.colors)&&N(r.SKUs)===N(x.skus))));let r=near(rows,r=>Math.abs(N(r['Bag Height (mm)'])-N(x.h))+Math.abs(N(r['Bag Width (mm)'])-N(x.w))+Math.abs(Math.log10(Math.max(1,N(r['Amount (bags)'])))-Math.log10(Math.max(1,N(x.amount))))*100);if(!r)return null;let price=N(r['Price / Bag (€)'])/Math.max(.01,1-N(x.gp)/100);return{price,total:price*N(x.amount),b4p:price*1000,moq:N(r['Bag MOQ'])}}
function outL(i){let r=lcalc(LS[i]);q('out'+i).innerHTML=[['Calculated Length',r?F(r.m,0)+' m':'-'],['Calculated Weight',r?F(r.kg)+' kg':'-'],['Total Sell',r?'€'+F(r.total):'-'],['Calculation per 1000 meter for B4P',r?'€'+F(r.b4p):'-']].map(a=>`<div class="result"><small>${a[0]}</small><b>${a[1]}</b></div>`).join('');let s=q('state'+i);s.className='state '+(r&&r.kg>=r.moq?'good':'bad');s.textContent=r?(r.kg>=r.moq?'✓ MOQ reached':`Quantity must be at least ${F(r.moq,0)} kg`):'Enter width and quantity';q('final'+i).textContent=r?'€'+F(r.sell):'-'}
function outP(i){let r=pcalc(PS[i]);q('pout'+i).innerHTML=[['Bag MOQ',r?F(r.moq,0):'-'],['Price / Bag',r?'€'+F(r.price,4):'-'],['Total Order',r?'€'+F(r.total):'-'],['Calculation per 1000 meter for B4P',r?'€'+F(r.b4p):'-']].map(a=>`<div class="result"><small>${a[0]}</small><b>${a[1]}</b></div>`).join('');let s=q('pstate'+i);s.className='state '+(r&&N(PS[i].amount)>=r.moq?'good':'bad');s.textContent=r?(N(PS[i].amount)>=r.moq?'✓ MOQ reached':`Below MOQ by ${F(r.moq-N(PS[i].amount),0)} bags`):'Enter valid inputs';q('pfinal'+i).textContent=r?'€'+F(r.price,4):'-'}
function bindL(i){let x=LS[i];[['w','w'],['qty','qty'],['iw','iw'],['ih','ih'],['gp','gp']].forEach(([a,k])=>{let e=q(a+i);if(e)e.oninput=v=>{x[k]=v.target.value;outL(i)}});[['th','th'],['mode','mode'],['colors','colors'],['skus','skus']].forEach(([a,k])=>{let e=q(a+i);if(e)e.onchange=v=>{x[k]=v.target.value;k==='mode'?render():outL(i)}});q('lam'+i).onchange=e=>{x.lam=e.target.value;x.th=DATA.laminates[x.lam][0];render()};q('printing'+i).onchange=e=>{x.printing=e.target.value;if(x.printing==='Not Printed'){x.colors='0';x.skus=0}else{x.colors='1-2';x.skus=1}render()};outL(i)}
function bindP(i){let x=PS[i];[['h','h'],['pw','w'],['g','g'],['flap','flap'],['amount','amount'],['pgp','gp']].forEach(([a,k])=>q(a+i).oninput=e=>{x[k]=e.target.value;outP(i)});[['pth','th'],['pcolors','colors'],['pskus','skus']].forEach(([a,k])=>{let e=q(a+i);if(e)e.onchange=v=>{x[k]=v.target.value;outP(i)}});q('type'+i).onchange=e=>{x.type=e.target.value;render()};q('plam'+i).onchange=e=>{x.lam=e.target.value;x.th=DATA.laminates[x.lam][0];render()};q('pprint'+i).onchange=e=>{x.printing=e.target.value;if(x.printing==='Not Printed'){x.colors='0';x.skus=0}else{x.colors='1-2';x.skus=1}render()};outP(i)}
function login(){q('root').innerHTML=`<div class="login"><div class="loginbox"><div class="logo"><img src="bio4pack-logo-v16.png"></div><h1>BIO4PACK Pricing Suite</h1><p>Secure commercial pricing workspace</p><div class="pwd"><input id="pwd" type="password" placeholder="Password"><button class="btn" id="show">Show</button></div><button id="unlock" class="unlock">Unlock Calculator</button><div id="err"></div></div></div>`;q('show').onclick=()=>q('pwd').type=q('pwd').type==='password'?'text':'password';q('unlock').onclick=()=>{if(q('pwd').value==='Success2026'){sessionStorage.setItem('b4p_access','granted');auth=true;render()}else q('err').textContent='Incorrect password'}}
function render(){if(!auth)return login();let t=document.documentElement.dataset.theme;q('root').innerHTML=`<div class="app"><header><div class="top"><div class="logo"><img src="bio4pack-logo-v16.png"></div><div><div class="title">BIO4PACK Pricing Suite</div><div class="sub">Commercial pricing workspace</div></div><div class="controls"><button class="btn" id="theme">${t==='dark'?'☀ Light':'◐ Dark'}</button><button class="btn" id="qr">QR Code</button><button class="btn" id="install">Install App</button><button class="btn" id="lock">Lock</button></div></div></header><main class="page"><section class="notice"><b>CONFIDENTIAL · AUTHORIZED USE ONLY</b><br>Proprietary pricing methodologies, cost structures and commercial calculations.</section><nav class="tabs"><button id="tabL" class="tab ${module==='lam'?'active':''}">Laminates</button><button id="tabP" class="tab ${module==='pouch'?'active':''}">Pouches</button></nav><section class="workspace"><h2>${module==='lam'?'Laminate':'Pouch'} pricing</h2><button class="btn" id="compare">${cmp[module]?'Hide comparison':'Compare two calculations'}</button></section><div class="cards ${cmp[module]?'':'single'}">${module==='lam'?lcard(0)+(cmp.lam?lcard(1):''):pcard(0)+(cmp.pouch?pcard(1):'')}</div><footer class="footer">CONFIDENTIAL · v60-full-feature-patch</footer></main></div>`;q('theme').onclick=()=>{document.documentElement.dataset.theme=t==='dark'?'light':'dark';localStorage.setItem('b4p_theme',document.documentElement.dataset.theme);render()};q('qr').onclick=()=>q('qrModal').classList.add('open');q('install').onclick=()=>deferredPrompt?deferredPrompt.prompt():alert('Use your browser menu to install the app');q('lock').onclick=()=>{sessionStorage.removeItem('b4p_access');auth=false;render()};q('tabL').onclick=()=>{module='lam';render()};q('tabP').onclick=()=>{module='pouch';render()};q('compare').onclick=()=>{cmp[module]=!cmp[module];render()};if(module==='lam'){bindL(0);if(cmp.lam)bindL(1)}else{bindP(0);if(cmp.pouch)bindP(1)}}
q('closeQr').onclick=()=>q('qrModal').classList.remove('open');addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});document.documentElement.dataset.theme=localStorage.getItem('b4p_theme')||'dark';async function load(){for(const u of ['./model_data.json?v=60','https://bishmalovich-web.github.io/BIO4PACK--Laminates-Pouches-final-app/model_data.json?v=60'])try{let r=await fetch(u,{cache:'no-store'});if(r.ok){DATA=await r.json();render();return}}catch(e){}q('root').innerHTML='<div class="page"><div class="error"><b>model_data.json did not load.</b><br>Upload model_data.json with this package to the repository root.</div></div>'}load();
</script></body></html>
