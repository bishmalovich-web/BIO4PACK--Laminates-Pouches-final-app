var(--line);border-radius:19px;overflow:hidden;box-shadow:var(--shadow)}.head{padding:15px 18px;color:#fff;background:linear-gradient(135deg,#175368,#0b8f87);font-weight:900;font-size:18px}.two .head{background:linear-gradient(135deg,#713117,#c66b08)}.pcard .head{background:linear-gradient(135deg,#433b8e,#9b3b79)}.body{padding:18px}.section{margin:16px 0 9px;color:var(--teal);font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px}.field label{display:block;color:var(--muted);font-size:9px;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;height:36px;border:0;outline:0;background:transparent;color:var(--text);font-weight:850}.note{margin-top:10px;background:var(--warn);color:var(--warntext);border-radius:9px;padding:9px 11px;font-size:11px}.outputs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.result{min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px}.result small{color:var(--muted)}.result b{display:block;margin-top:5px;font-size:18px}.status{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.state,.gp{border-radius:11px;padding:10px;font-weight:850}.good{background:var(--good);color:var(--goodtext)}.bad{background:var(--bad);color:var(--badtext)}.gp{background:color-mix(in srgb,var(--cyan) 9%,var(--panel))}.gp input{width:100%;margin-top:5px}.price{margin-top:11px;background:linear-gradient(160deg,var(--price),var(--price2));color:#fff;border-radius:15px;overflow:hidden}.priceh{padding:10px;text-align:center;background:linear-gradient(135deg,#24b8c8,#70ddd5);color:#063c41;font-weight:950}.hero{text-align:center;padding:18px}.hero b{display:block;font-size:35px}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg) 48%)}.loginbox{width:min(460px,94vw);background:var(--panel);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.loginbox .logo{height:100px}.pwd{display:grid;grid-template-columns:1fr 85px;gap:8px}.pwd input,.pwd button,.unlock{height:44px;border-radius:8px;padding:9px}.unlock{width:100%;margin-top:8px;background:#29b4c7;border:0;font-weight:900}.modal{position:fixed;inset:0;z-index:100;background:#02081299;display:grid;place-items:center;opacity:0;pointer-events:none}.modal.open{opacity:1;pointer-events:auto}.modal-card{width:min(390px,92vw);background:var(--panel);border-radius:18px;padding:20px;text-align:center}.qr{width:220px;height:220px;object-fit:contain}.footer{text-align:center;color:var(--muted);padding:18px}@media(max-width:900px){.top{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.grid,.outputs{grid-template-columns:1fr 1fr}}@media(max-width:540px){.grid,.outputs,.status{grid-template-columns:1fr}.page{padding:12px}}
</style></head><body><div id="root"></div><div id="qrModal" class="modal"><div class="modal-card"><h3>Install BIO4PACK Pricing</h3><img class="qr" src="qr-code-v16.png"><p><button class="btn" id="closeQr">Close</button></p></div></div><script>
let DATA=null,auth=sessionStorage.getItem('b4p_access')==='granted',module='lam',compare=true,deferredPrompt;const q=id=>document.getElementById(id),N=x=>Number(x)||0,F=(x,n=2)=>Number(x).toLocaleString(undefined,{maximumFractionDigits:n,minimumFractionDigits:n}),opts=(a,v)=>a.map(x=>`<option ${String(x)==String(v)?'selected':''}>${x}</option>`).join('');let LAMINATES=[];const PRODUCER='Marma';
function field(l,id,v,a){return `<div class=field><label>${l}</label>${a?`<select id=${id}>${opts(a,v)}</select>`:`<input id=${id} value="${v??''}">`}</div>`}function scope(a){let x=a.filter(r=>(r.Supplier||r.Producer)===PRODUCER);return x.length?x:a}function near(a,f){return a.reduce((b,r)=>!b||f(r)<f(b)?r:b,null)}function newL(l){return{lam:l,th:DATA.laminates[l][0],w:'',core:"3''",mode:'By Length',qty:'',printing:'Printed',colors:'3-4',skus:1,iw:'',ih:'',gp:15}}let LS=[];function newP(l){return{type:'Zipper pouch',lam:l,th:DATA.laminates[l][0],h:163,w:121,g:34.5,flap:0,amount:60000,printing:'Printed',colors:'3-4',skus:1,gp:15}}let PS=[];
function lcalc(x){if(!N(x.w)||!N(x.qty)||(x.mode==='By Imp'&&(!N(x.iw)||!N(x.ih))))return null;let np=x.printing==='Not Printed',bt=N(DATA.baseThickness[x.lam]),tr=N(x.th)/bt,rows=scope(DATA.lamRows.filter(z=>String(z.Laminate)===x.lam&&N(z['Total Thickness (µ)'])===bt&&z['PR / NonPR']==='Printed'&&((np&&String(z.Colors)==='1-2'&&N(z.SKUs)===1)||(!np&&String(z.Colors)===String(x.colors)&&N(z.SKUs)===N(x.skus)))));if(!rows.length)return null;let r=near(rows,z=>{let k=N(z['Total KG'])/N(z['Laminate Length (m)'])*tr,m=x.mode==='By Weight'?N(x.qty)/k:x.mode==='By Imp'?N(x.qty)/(N(x.w)/N(x.iw))*(N(x.ih)/1000):N(x.qty),kg=m*k;return Math.abs(N(z['Width Asked (mm)'])-N(x.w))/120+Math.abs(Math.log10(Math.max(1,N(z['Total KG'])))-Math.log10(Math.max(1,kg)))*2});let k=N(r['Total KG'])/N(r['Laminate Length (m)'])*tr,m,kg;if(x.mode==='By Weight'){kg=N(x.qty);m=kg/k}else if(x.mode==='By Imp'){m=N(x.qty)/(N(x.w)/N(x.iw))*(N(x.ih)/1000);kg=m*k}else{m=N(x.qty);kg=m*k}let cost=np?Math.max(0,N(r['Cost/KG (€)'])-N(r['Design Setup €/kg'])):N(r['Cost/KG (€)']),sell=(np?cost/(1-(N(r.Margin)||.15)):N(r['Sell Price / KG (€)']))/Math.max(.01,1-N(x.gp)/100);return{m,kg,sell,total:sell*kg,b4p:sell*k*1000,moq:N(r['KG MOQ'])||500}}
function pos(v){return typeof v==='number'&&isFinite(v)&&v>0}function pcalc(x){if(!N(x.amount))return null;let np=x.printing==='Not Printed',bt=N(DATA.baseThickness[x.lam]),tr=N(x.th)/bt,match=z=>String(z.Laminate)===x.lam&&N(z['Thickness (µ)'])===bt&&z['PR / NonPR']==='Printed'&&((np&&String(z.Colors)==='1-2'&&N(z.SKUs)===1)||(!np&&String(z.Colors)===String(x.colors)&&N(z.SKUs)===N(x.skus))),valid=z=>match(z)&&pos(z['Price / Bag (€)'])&&pos(z['Total Cost €/pouch']),rows=scope(DATA.pouchRows.filter(z=>valid(z)&&String(z['Pouch Type']).toLowerCase()===x.type.toLowerCase()));if(!rows.length)rows=scope(DATA.pouchRows.filter(valid));if(!rows.length)return null;let r=near(rows,z=>Math.abs(N(z['Bag Height (mm)'])-N(x.h))/100+Math.abs(N(z['Bag Width (mm)'])-N(x.w))/100+Math.abs(N(z['Base Gusset / 2 (mm)'])-N(x.g))/50+Math.abs(Math.log10(Math.max(1,N(z['Amount (bags)'])))-Math.log10(Math.max(1,N(x.amount))))*2),baseCost=N(r['Total Cost €/pouch']),basePrice=N(r['Price / Bag (€)']),lamPerBag=0;if(pos(r['Laminate €/pouch']))lamPerBag=N(r['Laminate €/pouch']);else if(pos(r['Laminate Cost / pouch (€)']))lamPerBag=N(r['Laminate Cost / pouch (€)']);else if(pos(r['Laminate €/m'])){let totalLen=N(r['Calculated Laminate Length (m)'])||N(r['Laminate Length Needed (m)']);lamPerBag=N(r['Laminate €/m'])*totalLen/Math.max(1,N(r['Amount (bags)']))}if(!pos(lamPerBag))lamPerBag=baseCost*.55;let cost=baseCost-lamPerBag+lamPerBag*tr;if(np){let setup=N(r['Setup Fallout €/pouch']),zip=N(r['Zipper €/pouch']);cost=Math.max(baseCost*.25,cost-setup);if(String(x.type).toLowerCase()==='open pouch')cost=Math.max(baseCost*.2,cost-zip)}let markup=basePrice/baseCost,baseOut=np?cost/(1-(N(r.Margin)||.15)):cost*markup,price=baseOut/Math.max(.01,1-N(x.gp)/100);if(!pos(price))return null;return{price,total:price*N(x.amount),b4p:price*1000,moq:N(r['Bag MOQ'])||N(r['Amount (bags)']),scenario:r['Scenario ID']}}function final(r,p){return `<div class=price><div class=priceh>${p?'Final Price':'Calculation per 1000 meter for B4P'}</div><div class=hero><small>${p?'PRICE PER POUCH':'B4P PRICE PER 1000 METER'}</small><b>${r?'€'+F(p?r.price:r.b4p,p?4:2):'-'}</b></div></div>`}
function lcard(i){let x=LS[i],r=lcalc(x),imp=x.mode==='By Imp';return `<article class="card ${i?'two':''}"><div class=head>Calculator ${i+1} · ${x.lam}</div><div class=body><div class=section>Material setup</div><div class=grid>${field('Laminate','lam'+i,x.lam,LAMINATES)}${field('Total Thickness (µm)','th'+i,x.th,DATA.laminates[x.lam])}${field('Width of Reel (mm)','w'+i,x.w)}${field('🔄 Core size','core'+i,x.core,["3''","6''"])}</div><div class=section>Production inputs</div><div class=grid>${field('Units','mode'+i,x.mode,['By Length','By Weight','By Imp'])}${field('Total Quantity','qty'+i,x.qty)}${field('Printing','pr'+i,x.printing,['Printed','Not Printed'])}${x.printing==='Printed'?field('Colors','co'+i,x.colors,['1-2','3-4','5-8'])+field('No. of SKUs','sk'+i,x.skus,[1,2,3,4,5,6,7,8]):''}${field('IMP Width (mm)','iw'+i,x.iw)}${field('IMP Height (mm)','ih'+i,x.ih)}</div><div class=note>Shipping Terms: EXW. Producer: Marma.</div><div class=outputs>${[['Calculated Length',r?F(r.m)+' m':'-'],['Calculated Weight',r?F(r.kg)+' kg':'-'],['Total Sell',r?'€'+F(r.total):'-'],['SELL PRICE PER KG',r?'€'+F(r.sell):'-']].map(a=>`<div class=result><small>${a[0]}</small><b>${a[1]}</b></div>`).join('')}</div><div class=status><div class="state ${r?'good':'bad'}">${r?(r.kg>=r.moq?'✓ MOQ reached':'Below MOQ'):'Enter width and quantity'}</div><div class=gp>Additional Gross Profit %<input id=gp${i} value=${x.gp}></div></div>${final(r,false)}</div></article>`}
function pcard(i){let x=PS[i],r=pcalc(x);return `<article class="card pcard ${i?'two':''}"><div class=head>Pouch Calculator ${i+1}</div><div class=body><div class=grid>${field('Pouch Type','pt'+i,x.type,['Zipper pouch','SUP with zipper','Open pouch'])}${field('Laminate','pl'+i,x.lam,LAMINATES)}${field('Thickness (µm)','pth'+i,x.th,DATA.laminates[x.lam])}${field('Height (mm)','ph'+i,x.h)}${field('Width (mm)','pw'+i,x.w)}${field('Amount (bags)','pa'+i,x.amount)}${field('Printing','ppr'+i,x.printing,['Printed','Not Printed'])}${x.printing==='Printed'?field('Colors','pco'+i,x.colors,['1-2','3-4','5-8'])+field('No. of SKUs','psk'+i,x.skus,[1,2,3,4,5,6,7,8]):''}</div><div class=note>Shipping Terms: EXW. Producer: Marma.</div><div class=outputs>${[['Bag MOQ',r?F(r.moq,0):'-'],['Price / Bag',r?'€'+F(r.price,4):'-'],['Total Order',r?'€'+F(r.total):'-'],['SELL PRICE PER KG',r?'€'+F(r.sell):'-']].map(a=>`<div class=result><small>${a[0]}</small><b>${a[1]}</b></div>`).join('')}</div><div class=status><div class="state ${r?'good':'bad'}">${r?'✓ Calculation ready':'Enter valid inputs'}</div><div class=gp>Additional Gross Profit %<input id=pgp${i} value=${x.gp}></div></div>${final(r,true)}</div></article>`}
function bind(){let arr=module==='lam'?LS:PS;arr.forEach((x,i)=>{let map=module==='lam'?{lam:'lam',th:'th',w:'w',core:'core',mode:'mode',qty:'qty',printing:'pr',colors:'co',skus:'sk',iw:'iw',ih:'ih',gp:'gp'}:{type:'pt',lam:'pl',th:'pth',h:'ph',w:'pw',amount:'pa',printing:'ppr',colors:'pco',skus:'psk',gp:'pgp'};Object.entries(map).forEach(([k,p])=>{let e=q(p+i);if(e)e.onchange=()=>{x[k]=e.value;if(k==='lam')x.th=DATA.laminates[x.lam][0];render()}})})}
function login(){q('root').innerHTML=`<div class=login><div class=loginbox><div class=logo><img src=bio4pack-logo-v16.png></div><h1>BIO4PACK Pricing Suite</h1><p>Secure commercial pricing workspace</p><div class=pwd><input id=pwd type=password placeholder=Password><button class=btn id=show>Show</button></div><button id=unlock class=unlock>Unlock Calculator</button><div id=err></div></div></div>`;q('show').onclick=()=>q('pwd').type=q('pwd').type==='password'?'text':'password';q('unlock').onclick=()=>{if(q('pwd').value==='Success2026'){sessionStorage.setItem('b4p_access','granted');auth=true;render()}else q('err').textContent='Incorrect password'}}
function render(){if(!auth)return login();let cards=(module==='lam'?LS.map((x,i)=>lcard(i)):PS.map((x,i)=>pcard(i))).join('');q('root').innerHTML=`<div class=app><header><div class=top><div class=logo><img src=bio4pack-logo-v16.png></div><div><div class=title>BIO4PACK Pricing Suite</div><div class=sub>Commercial pricing workspace</div></div><div class=controls><button class=btn id=theme>Dark / Light</button><button class=btn id=cmp>${compare?'Single':'Compare'}</button><button class=btn id=qr>QR</button><button class=btn id=install>Install App</button><button class=btn id=lock>Lock</button></div></div></header><main class=page><div class=workspace><div class=tabs><button class="tab ${module==='lam'?'active':''}" id=tl>Laminates</button><button class="tab ${module==='pou'?'active':''}" id=tp>Pouches</button></div></div><div class=cards>${cards}</div><div class=footer>CONFIDENTIAL · V61.3.1</div></main></div>`;q('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};q('cmp').onclick=()=>{compare=!compare;if(module==='lam')LS=compare?[LS[0],newL(LAMINATES[1])]:[LS[0]];else PS=compare?[PS[0],newP(LAMINATES[1])]:[PS[0]];render()};q('tl').onclick=()=>{module='lam';render()};q('tp').onclick=()=>{module='pou';render()};q('qr').onclick=()=>q('qrModal').classList.add('open');q('lock').onclick=()=>{sessionStorage.removeItem('b4p_access');auth=false;render()};q('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}};bind()}
q('closeQr').onclick=()=>q('qrModal').classList.remove('open');addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});document.documentElement.dataset.theme=localStorage.getItem('b4p_theme')||'dark';async function boot(){try{let r=await fetch('./model_data.json?v=61.3.1',{cache:'no-store'});DATA=await r.json();LAMINATES=DATA.allowedLaminates;LS=[newL(LAMINATES[0]),newL(LAMINATES[1])];PS=[newP(LAMINATES[0]),newP(LAMINATES[1])];if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render()}catch(e){q('root').innerHTML='<div class=page><h2>model_data.json did not load</h2></div>'}}boot();
</script></body></html>
