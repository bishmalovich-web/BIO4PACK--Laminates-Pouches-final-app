<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><title>BIO4PACK Pricing Suite</title><style>
:root{--bg:#f3f6fa;--bg2:#e9f8fa;--panel:#fff;--panel2:#f6f8fb;--line:#dce5ef;--text:#17243a;--muted:#68788e;--teal:#087f78;--warn:#fff8df;--good:#e8f8f1;--bad:#fff0ef;--price:#122236;--shadow:0 14px 36px #0f233a17}html[data-theme=dark]{color-scheme:dark;--bg:#07111f;--bg2:#07333b;--panel:#101d31;--panel2:#0b1728;--line:#2d425f;--text:#f8fafc;--muted:#aebed2;--warn:#3d3217;--good:#12392d;--bad:#421f24;--price:#050c17;--shadow:0 16px 42px #0005}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,"Segoe UI",Arial;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{min-height:100vh;background:linear-gradient(145deg,var(--bg2),var(--bg) 34%)}header{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 24px}.top{max-width:1560px;margin:auto;display:grid;grid-template-columns:150px 1fr auto;gap:18px;align-items:center}.logo{height:54px;background:#fff;border-radius:11px;padding:6px}.logo img{width:100%;height:100%;object-fit:contain}.title{font-size:21px;font-weight:900}.sub,label,small{color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 13px;font-weight:850}.page{max-width:1560px;margin:auto;padding:22px}.tabs{display:flex;background:var(--panel2);padding:5px;border-radius:13px;width:max-content;margin:15px 0}.tab{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:10px 28px;font-weight:900}.tab.active{background:var(--panel);color:var(--text)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:var(--shadow)}.head{padding:15px 18px;color:white;background:linear-gradient(135deg,#175368,#0b8f87);font-weight:900;font-size:18px}.two .head{background:linear-gradient(135deg,#713117,#c66b08)}.pcard .head{background:linear-gradient(135deg,#433b8e,#9b3b79)}.body{padding:18px}.section{margin:16px 0 9px;color:var(--teal);font-size:11px;font-weight:950;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px}.field label{display:block;font-size:9px;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;height:36px;border:0;background:transparent;color:var(--text);font-weight:850}.note{margin-top:10px;background:var(--warn);color:#a97b22;border-radius:9px;padding:9px 11px;font-size:11px}.outputs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.result{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px}.result b{display:block;margin-top:5px;font-size:18px}.status{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.state,.gp{border-radius:11px;padding:10px;font-weight:850}.good{background:var(--good)}.bad{background:var(--bad)}.gp input{width:100%;margin-top:5px}.price{margin-top:11px;background:var(--price);color:white;border-radius:15px;overflow:hidden}.priceh{padding:10px;text-align:center;background:#43cbd1;color:#063c41;font-weight:950}.hero{text-align:center;padding:18px}.hero b{display:block;font-size:35px}.login{min-height:100vh;display:grid;place-items:center}.loginbox{width:min(460px,94vw);background:var(--panel);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.loginbox .logo{height:100px}.pwd{display:grid;grid-template-columns:1fr 85px;gap:8px}.pwd input,.pwd button,.unlock{height:44px;border-radius:8px;padding:9px}.unlock{width:100%;margin-top:8px;background:#29b4c7;border:0;font-weight:900}.modal{position:fixed;inset:0;z-index:100;background:#02081299;display:none;place-items:center}.modal.open{display:grid}.modal-card{background:var(--panel);border-radius:18px;padding:20px;text-align:center}.qr{width:220px}.footer{text-align:center;color:var(--muted);padding:18px}@media(max-width:900px){.top{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.grid,.outputs{grid-template-columns:1fr 1fr}}@media(max-width:540px){.grid,.outputs,.status{grid-template-columns:1fr}.page{padding:12px}}
</style></head><body><div id="root"></div><div id="qrModal" class="modal"><div class="modal-card"><h3>Install BIO4PACK Pricing</h3><img class="qr" src="qr-code-v16.png"><p><button class="btn" id="closeQr">Close</button></p></div></div><script>
let DATA=null,auth=sessionStorage.getItem('b4p_access')==='granted',module='lam',compare=true,deferredPrompt;const q=id=>document.getElementById(id),N=x=>Number(x)||0,F=(x,n=2)=>Number(x).toLocaleString(undefined,{maximumFractionDigits:n,minimumFractionDigits:n}),opts=(a,v)=>a.map(x=>`<option ${String(x)==String(v)?'selected':''}>${x}</option>`).join('');let LAMS=[];function field(l,id,v,a){return `<div class=field><label>${l}</label>${a?`<select id=${id}>${opts(a,v)}</select>`:`<input id=${id} value="${v??''}">`}</div>`}function newL(l){return{lam:l,th:DATA.laminates[l][0],w:'',core:"3''",mode:'By Length',qty:'',printing:'Printed',colors:'3-4',skus:1,gp:0}}function newP(l){return{type:'Zipper pouch',lam:l,th:DATA.laminates[l][0],h:100,w:100,g:20,amount:60000,printing:'Printed',colors:'3-4',skus:1,gp:0}}let LS=[],PS=[];function nearest(a,score){return a.reduce((b,r)=>!b||score(r)<score(b)?r:b,null)}
function lcalc(x){if(!N(x.w)||!N(x.qty))return null;let np=x.printing==='Not Printed',rows=DATA.lamRows.filter(r=>String(r.Laminate)===x.lam&&N(r['Total Thickness (µ)'])===N(x.th)&&r['Model Check']==='PASS'&&((np&&String(r.Colors)==='1-2'&&N(r.SKUs)===1)||(!np&&String(r.Colors)===String(x.colors)&&N(r.SKUs)===N(x.skus))));if(!rows.length)return null;let r=nearest(rows,z=>{let k=N(z['Total KG'])/N(z['Laminate Length (m)'])*(N(x.w)/N(z['Width Asked (mm)'])),m=x.mode==='By Weight'?N(x.qty)/k:N(x.qty),kg=x.mode==='By Weight'?N(x.qty):m*k;return Math.abs(N(z['Width Asked (mm)'])-N(x.w))/100+Math.abs(Math.log10(Math.max(1,N(z['Total KG'])))-Math.log10(Math.max(1,kg)))*4}),k=N(r['Total KG'])/N(r['Laminate Length (m)'])*(N(x.w)/N(r['Width Asked (mm)'])),m=x.mode==='By Weight'?N(x.qty)/k:N(x.qty),kg=x.mode==='By Weight'?N(x.qty):m*k,npF={'418':.86,'428':.86,'618':.804,'618 W':.804,'648':.84,'648W':.84,'819':.931,'823':.872,'821M':.90}[x.lam]||.88,prF=1,core=String(x.core).startsWith('6')?1:.99,sell=N(r['Sell Price / KG (€)'])*(np?npF:prF)*core/Math.max(.01,1-N(x.gp)/100),b4p=N(r['B4P €/1000m'])*(N(x.w)/N(r['Width Asked (mm)']))*(np?npF:prF)*core/Math.max(.01,1-N(x.gp)/100);return{m,kg,sell,b4p,total:sell*kg,moq:N(r['KG MOQ'])||500}}
function pcalc(x){if(!N(x.amount))return null;let np=x.printing==='Not Printed',rows=DATA.pouchRows.filter(r=>String(r.Laminate)===x.lam&&N(r['Thickness (µ)'])===N(x.th)&&String(r['Pouch Type']).toLowerCase()===x.type.toLowerCase()&&r['Model Check']==='PASS'&&((np&&String(r.Colors)==='1-2'&&N(r.SKUs)===1)||(!np&&String(r.Colors)===String(x.colors)&&N(r.SKUs)===N(x.skus))));if(!rows.length)return null;let r=nearest(rows,z=>Math.abs(N(z['Bag Height (mm)'])-N(x.h))/100+Math.abs(N(z['Bag Width (mm)'])-N(x.w))/100+Math.abs(Math.log10(Math.max(1,N(z['Amount (bags)'])))-Math.log10(Math.max(1,N(x.amount))))*3),base=N(r['Price / Bag (€)']),price=(np?base*.88:base)/Math.max(.01,1-N(x.gp)/100);return{price,b4p:price*1000,total:price*N(x.amount),moq:N(r['Bag MOQ'])}}
function final(r,p){return `<div class=price><div class=priceh>${p?'Final Price':'Calculation per 1000 meter for B4P'}</div><div class=hero><small>${p?'PRICE PER POUCH':'B4P PRICE PER 1000 METER'}</small><b>${r?'€'+F(p?r.price:r.b4p,p?4:2):'-'}</b></div></div>`}function cardL(i){let x=LS[i],r=lcalc(x);return `<article class="card ${i?'two':''}"><div class=head>Calculator ${i+1} · ${x.lam}</div><div class=body><div class=section>Material setup</div><div class=grid>${field('Laminate','lam'+i,x.lam,LAMS)}${field('Total Thickness (µm)','th'+i,x.th,DATA.laminates[x.lam])}${field('Width of Reel (mm)','w'+i,x.w)}${field('🔄 Core size','core'+i,x.core,["3''","6''"])}</div><div class=section>Production inputs</div><div class=grid>${field('Units','mode'+i,x.mode,['By Length','By Weight'])}${field('Total Quantity','qty'+i,x.qty)}${field('Printing','pr'+i,x.printing,['Printed','Not Printed'])}${x.printing==='Printed'?field('Colors','co'+i,x.colors,['1-2','3-4','5-8'])+field('No. of SKUs','sk'+i,x.skus,[1,2,3,4,5,6,7,8]):''}</div><div class=note>Shipping Terms: EXW. Producer: Marma.</div><div class=outputs>${[['Calculated Length',r?F(r.m)+' m':'-'],['Calculated Weight',r?F(r.kg)+' kg':'-'],['Total Sell',r?'€'+F(r.total):'-'],['SELL PRICE PER KG',r?'€'+F(r.sell):'-']].map(a=>`<div class=result><small>${a[0]}</small><b>${a[1]}</b></div>`).join('')}</div><div class=status><div class="state ${r?'good':'bad'}">${r?'✓ Calculation ready':'Enter width and quantity'}</div><div class=gp>Additional Gross Profit %<input id=gp${i} value=${x.gp}></div></div>${final(r,false)}</div></article>`}function cardP(i){let x=PS[i],r=pcalc(x);return `<article class="card pcard ${i?'two':''}"><div class=head>Pouch Calculator ${i+1}</div><div class=body><div class=grid>${field('Pouch Type','pt'+i,x.type,['Zipper pouch','SUP with zipper','Open pouch'])}${field('Laminate','pl'+i,x.lam,LAMS)}${field('Thickness (µm)','pth'+i,x.th,DATA.laminates[x.lam])}${field('Height (mm)','ph'+i,x.h)}${field('Width (mm)','pw'+i,x.w)}${field('Amount (bags)','pa'+i,x.amount)}${field('Printing','ppr'+i,x.printing,['Printed','Not Printed'])}${x.printing==='Printed'?field('Colors','pco'+i,x.colors,['1-2','3-4','5-8'])+field('No. of SKUs','psk'+i,x.skus,[1,2,3,4,5,6,7,8]):''}</div><div class=note>Shipping Terms: EXW. Producer: Marma.</div><div class=outputs>${[['Bag MOQ',r?F(r.moq,0):'-'],['Price / Bag',r?'€'+F(r.price,4):'-'],['Total Order',r?'€'+F(r.total):'-'],['B4P / 1,000',r?'€'+F(r.b4p):'-']].map(a=>`<div class=result><small>${a[0]}</small><b>${a[1]}</b></div>`).join('')}</div>${final(r,true)}</div></article>`}
function bind(){let arr=module==='lam'?LS:PS;arr.forEach((x,i)=>{let map=module==='lam'?{lam:'lam',th:'th',w:'w',core:'core',mode:'mode',qty:'qty',printing:'pr',colors:'co',skus:'sk',gp:'gp'}:{type:'pt',lam:'pl',th:'pth',h:'ph',w:'pw',amount:'pa',printing:'ppr',colors:'pco',skus:'psk'};Object.entries(map).forEach(([k,p])=>{let e=q(p+i);if(e)e.onchange=()=>{x[k]=e.value;if(k==='lam')x.th=DATA.laminates[x.lam][0];render()}})})}function login(){q('root').innerHTML=`<div class=login><div class=loginbox><div class=logo><img src=bio4pack-logo-v16.png></div><h1>BIO4PACK Pricing Suite</h1><p>Secure commercial pricing workspace</p><div class=pwd><input id=pwd type=password placeholder=Password><button class=btn id=show>Show</button></div><button id=unlock class=unlock>Unlock Calculator</button><div id=err></div></div></div>`;q('show').onclick=()=>{let p=q('pwd');p.type=p.type==='password'?'text':'password'};let u=()=>{if(q('pwd').value==='Success2026'){sessionStorage.setItem('b4p_access','granted');auth=true;render()}else q('err').textContent='Incorrect password'};q('unlock').onclick=u;q('pwd').onkeydown=e=>{if(e.key==='Enter')u()}}function render(){if(!auth)return login();q('root').innerHTML=`<div class=app><header><div class=top><div class=logo><img src=bio4pack-logo-v16.png></div><div><div class=title>BIO4PACK Pricing Suite</div><div class=sub>Commercial pricing workspace</div></div><div class=controls><button class=btn id=theme>Dark / Light</button><button class=btn id=cmp>${compare?'Single':'Compare'}</button><button class=btn id=qr>QR</button><button class=btn id=install>Install App</button><button class=btn id=lock>Lock</button></div></div></header><main class=page><div class=tabs><button class="tab ${module==='lam'?'active':''}" id=tl>Laminates</button><button class="tab ${module==='pou'?'active':''}" id=tp>Pouches</button></div><div class=cards>${(module==='lam'?LS.map((x,i)=>cardL(i)):PS.map((x,i)=>cardP(i))).join('')}</div><div class=footer>CONFIDENTIAL · V61.4.1</div></main></div>`;q('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';q('cmp').onclick=()=>{compare=!compare;if(module==='lam')LS=compare?[LS[0],newL(LAMS[1])]:[LS[0]];else PS=compare?[PS[0],newP(LAMS[1])]:[PS[0]];render()};q('tl').onclick=()=>{module='lam';render()};q('tp').onclick=()=>{module='pou';render()};q('qr').onclick=()=>q('qrModal').classList.add('open');q('lock').onclick=()=>{sessionStorage.clear();auth=false;login()};q('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice}};bind()}q('closeQr').onclick=()=>q('qrModal').classList.remove('open');addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});async function boot(){let r=await fetch('./model_data.json?v=61.4.1',{cache:'no-store'});DATA=await r.json();LAMS=DATA.allowedLaminates;LS=[newL(LAMS[0]),newL(LAMS[1])];PS=[newP(LAMS[0]),newP(LAMS[1])];if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render()}boot();
</script></body></html>
