function field(l,id,v,arr,dis=false){return `<div class=field><label>${l}</label>${arr?`<select id=${id} ${dis?'disabled':''}>${opts(arr,v)}</select>`:`<input id=${id} value="${v??''}" inputmode=decimal ${dis?'disabled':''} placeholder="${dis?'Not required':'Type value'}">`}</div>`}function newL(l='618 W'){const t=(DATA.laminates[l]||[51])[0];return{lam:l,th:t,w:'',mode:'By Length',qty:'',printing:'Printed',colors:'3-4',designs:1,iw:'',ih:'',gp:0}}let LS=[newL(),newL('418')];function lcalc(x){if(!N(x.w)||!N(x.qty)||(x.mode==='By Imp'&&(!N(x.iw)||!N(x.ih))))return null;const rows=scope(DATA.lamRows.filter(r=>String(r.Laminate)===String(x.lam))),r=near(rows,z=>Math.abs(N(z['Width Asked (mm)'])-N(x.w))/120+Math.abs(Math.log10(Math.max(1,N(z['Input Quantity'])))-Math.log10(Math.max(1,N(x.qty))))*2+(z['Input Mode']===x.mode?0:8)+(z['PR / NonPR']===x.printing?0:5)+(String(z.Colors)===String(x.colors)?0:2)+Math.abs(N(z.Designs)-N(x.designs))*.3);if(!r)return null;const kpm=N(r['Total KG'])/Math.max(N(r['Laminate Length (m)']),1e-9);let m,kg;if(x.mode==='By Weight'){kg=N(x.qty);m=kg/kpm}else if(x.mode==='By Imp'){m=N(x.qty)/(N(x.w)/N(x.iw))*(N(x.ih)/1000);kg=m*kpm}else{m=N(x.qty);kg=m*kpm}const sell=N(r['Sell Price / KG (€)'])/(1-Math.min(.9,N(x.gp)/100));return{m,kg,sell,sellm:sell*kpm,total:sell*kg,imp:x.mode==='By Imp'?sell*kg/N(x.qty):null}}

function bindL(i){const x=LS[i];['w','qty','iw','ih','gp'].forEach(k=>q(k+i).oninput=e=>{x[k]=e.target.value;outL(i)});['th','colors','designs'].forEach(k=>q(k+i).onchange=e=>{x[k]=e.target.value;outL(i)});q('mode'+i).onchange=e=>{x.mode=e.target.value;render()};q('printing'+i).onchange=e=>{x.printing=e.target.value;if(x.printing==='Not Printed'){x.colors='0';x.designs=1}render()};q('lam'+i).onchange=e=>{x.lam=e.target.value;x.th=(DATA.laminates[x.lam]||[51])[0];render()};outL(i)}function outL(i){const r=lcalc(LS[i]);q('out'+i).innerHTML=[['Calculated Length',r?F(r.m,0)+' m':'-'],['Calculated Weight',r?F(r.kg,2)+' kg':'-'],['Total Sell',r?'€'+F(r.total):'-']].map(a=>`<div class=result><small>${a[0]}</small><b>${a[1]}</b></div>`).join('');const s=q('state'+i);s.className='state '+(r&&r.kg>=500?'good':'bad');s.textContent=r?(r.kg>=500?'✓ MOQ reached':'Quantity must be at least 500 kg'):'Enter width and quantity';q('final'+i).innerHTML=final(r,false);pulse(i,false)}
function bindP(i){const x=PS[i];[['h','h'],['pw','w'],['g','g'],['flap','flap'],['amount','amount'],['pgp','gp']].forEach(([id,k])=>q(id+i).oninput=e=>{x[k]=e.target.value;outP(i)});[['pth','th'],['pcolors','colors'],['pdesigns','designs']].forEach(([id,k])=>q(id+i).onchange=e=>{x[k]=e.target.value;outP(i)});q('type'+i).onchange=e=>{x.type=e.target.value;render()};q('plam'+i).onchange=e=>{x.lam=e.target.value;x.th=(DATA.laminates[x.lam]||[51])[0];render()};q('pprint'+i).onchange=e=>{x.printing=e.target.value;if(x.printing==='Not Printed'){x.colors='0';x.designs=1}render()};outP(i)}function outP(i){const r=pcalc(PS[i]);q('pout'+i).innerHTML=[['Bag MOQ',r?F(r.moq,0):'-'],['Price / Bag',r?'€'+F(r.price,4):'-'],['Total Order',r?'€'+F(r.total):'-']].map(a=>`<div class=result><small>${a[0]}</small><b>${a[1]}</b></div>`).join('');const s=q('pstate'+i);s.className='state '+(r&&N(PS[i].amount)>=r.moq?'good':'bad');s.textContent=r?(N(PS[i].amount)>=r.moq?'✓ MOQ reached':`Below MOQ by ${F(r.moq-N(PS[i].amount),0)} bags`):'Enter valid pouch inputs';q('pfinal'+i).innerHTML=final(r,true);pulse(i,true)}function pulse(i,p){requestAnimationFrame(()=>{const root=q((p?'pout':'out')+i),hero=q((p?'pfinal':'final')+i)?.querySelector('.hero');root?.querySelectorAll('.result').forEach(e=>e.classList.add('changed'));hero?.classList.add('changed');setTimeout(()=>{root?.querySelectorAll('.result').forEach(e=>e.classList.remove('changed'));hero?.classList.remove('changed')},340)})}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('b4p_theme',t);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#07111f':'#f3f6fa';notify(t==='dark'?'Dark mode enabled':'Light mode enabled');render()}function login(){q('root').innerHTML=`<div class=login><div class=loginbox><div class=logo><img src=bio4pack-logo-v16.png></div><h1>BIO4PACK Pricing Suite</h1><p>Secure commercial pricing workspace</p><div class=pwd><input id=pwd type=password placeholder=Password><button class=btn id=show>Show</button></div><button id=unlock class=unlock>Unlock Calculator</button><div id=err></div></div></div>`;q('show').onclick=()=>q('pwd').type=q('pwd').type==='password'?'text':'password';q('unlock').onclick=()=>{if(q('pwd').value==='Success2026'){sessionStorage.setItem('b4p_access','granted');auth=true;render()}else{q('err').textContent='Incorrect password';notify('Unable to unlock calculator')}}}
function render(){if(!auth)return login();const theme=document.documentElement.dataset.theme;q('root').innerHTML=`<div class=app><header><div class=top><div class=logo><img src=bio4pack-logo-v16.png></div><div><div class=title>BIO4PACK Pricing Suite</div><div class=sub>Commercial pricing workspace</div></div><div class=controls><button class=btn id=theme>${theme==='dark'?'☀ Light':'◐ Dark'}</button><button class=btn id=qr>QR Code</button><button class=btn id=install>Install App</button><button class=btn id=lock>Lock</button></div></div></header><main class=page><section class=notice><b>CONFIDENTIAL · AUTHORIZED USE ONLY</b><br>Proprietary pricing methodologies, cost structures and commercial calculations.</section><div class=navrow><nav class=tabs><button id=tabL class="tab ${module==='lam'?'active':''}">Laminates</button><button id=tabP class="tab ${module==='pouch'?'active':''}">Pouches</button></nav></div><section class=workspace><h2>${module==='lam'?'Laminate':'Pouch'} pricing</h2><button class=btn id=compare>${cmp[module]?'Hide comparison':'Compare two calculations'}</button></section><div class=cards>${module==='lam'?lcard(0)+(cmp.lam?lcard(1):''):pcard(0)+(cmp.pouch?pcard(1):'')}</div><footer class=footer>CONFIDENTIAL · ${DATA.version}</footer></main></div>`;q('theme').onclick=()=>setTheme(theme==='dark'?'light':'dark');q('qr').onclick=()=>q('qrModal').classList.add('open');q('install').onclick=()=>deferredPrompt?deferredPrompt.prompt():notify('Use your browser menu to install the app');q('lock').onclick=()=>{sessionStorage.removeItem('b4p_access');auth=false;render()};q('tabL').onclick=()=>{module='lam';render()};q('tabP').onclick=()=>{module='pouch';render()};q('compare').onclick=()=>{cmp[module]=!cmp[module];render()};if(module==='lam'){bindL(0);if(cmp.lam)bindL(1)}else{bindP(0);if(cmp.pouch)bindP(1)}}
q('closeQr').onclick=()=>q('qrModal').classList.remove('open');q('qrModal').onclick=e=>{if(e.target===q('qrModal'))q('qrModal').classList.remove('open')};addEventListener('keydown',e=>{if(e.key==='Escape')q('qrModal').classList.remove('open')});addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});document.documentElement.dataset.theme=localStorage.getItem('b4p_theme')||'dark';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
