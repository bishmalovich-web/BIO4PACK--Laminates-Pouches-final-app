ell',r?'€'+F(r.total):'-']].map(a=>`<div class=result><small>${a[0]}</small><b>${a[1]}</b></div>`).join('');let moq=r?r.moqkg:500,s=q('state'+i);s.className='state '+(r&&r.kg>=moq?'good':'bad');s.textContent=r?(r.kg>=moq?'✓ MOQ reached':`Quantity must be at least ${F(moq,0)} kg`):'Enter width and quantity';q('final'+i).innerHTML=final(r,false)}function bindP(i){let x=PS[i];[['h','h'],['pw','w'],['g','g'],['flap','flap'],['amount','amount'],['pgp','gp']].forEach(([id,k])=>q(id+i).oninput=e=>{x[k]=e.target.value;outP(i)});[['pth','th'],['pcolors','colors'],['pskus','skus']].forEach(([id,k])=>q(id+i).onchange=e=>{x[k]=e.target.value;outP(i)});q('type'+i).onchange=e=>{x.type=e.target.value;render()};q('plam'+i).onchange=e=>{x.lam=e.target.value;x.th=DATA.laminates[x.lam][0];render()};q('pprint'+i).onchange=e=>{x.printing=e.target.value;render()};outP(i)}function outP(i){let r=pcalc(PS[i]);q('pout'+i).innerHTML=[['Bag MOQ',r?F(r.moq,0):'-'],['Price / Bag',r?'€'+F(r.price,4):'-'],['Total Order',r?'€'+F(r.total):'-']].map(a=>`<div class=result><small>${a[0]}</small><b>${a[1]}</b></div>`).join('');let s=q('pstate'+i);s.className='state '+(r&&N(PS[i].amount)>=r.moq?'good':'bad');s.textContent=r?(N(PS[i].amount)>=r.moq?'✓ MOQ reached':`Below MOQ by ${F(r.moq-N(PS[i].amount),0)} bags`):'Enter valid inputs';q('pfinal'+i).innerHTML=final(r,true)}function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('b4p_theme',t);render()}function login(){q('root').innerHTML=`<div class=login><div class=loginbox><div class=logo><img src=bio4pack-logo-v16.png></div><h1>BIO4PACK Pricing Suite</h1><p>Secure commercial pricing workspace</p><div class=pwd><input id=pwd type=password placeholder=Password><button class=btn id=show>Show</button></div><button id=unlock class=unlock>Unlock Calculator</button><div id=err></div></div></div>`;q('show').onclick=()=>{q('pwd').type=q('pwd').type==='password'?'text':'password'};q('unlock').onclick=()=>{if(q('pwd').value==='Success2026'){sessionStorage.setItem('b4p_access','granted');auth=true;render()}else q('err').textContent='Incorrect password'}}function render(){if(!auth)return login();let t=document.documentElement.dataset.theme;q('root').innerHTML=`<div class=app><header><div class=top><div class=logo><img src=bio4pack-logo-v16.png></div><div><div class=title>BIO4PACK Pricing Suite</div><div class=sub>Commercial pricing workspace</div></div><div class=controls><button class=btn id=theme>${t==='dark'?'☀ Light':'◐ Dark'}</button><button class=btn id=qr>QR Code</button><button class=btn id=install>Install App</button><button class=btn id=lock>Lock</button></div></div></header><main class=page><section class=notice><b>CONFIDENTIAL · AUTHORIZED USE ONLY</b><br>Proprietary pricing methodologies, cost structures and commercial calculations.</section><nav class=tabs><button id=tabL class="tab ${module==='lam'?'active':''}">Laminates</button><button id=tabP class="tab ${module==='pouch'?'active':''}">Pouches</button></nav><section class=workspace><h2>${module==='lam'?'Laminate':'Pouch'} pricing</h2><button class=btn id=compare>${cmp[module]?'Hide comparison':'Compare two calculations'}</button></section><div class=cards>${module==='lam'?lcard(0)+(cmp.lam?lcard(1):''):pcard(0)+(cmp.pouch?pcard(1):'')}</div><footer class=footer>CONFIDENTIAL · ${DATA.version}</footer></main></div>`;q('theme').onclick=()=>setTheme(t==='dark'?'light':'dark');q('qr').onclick=()=>q('qrModal').classList.add('open');q('install').onclick=()=>deferredPrompt?deferredPrompt.prompt():notify('Use your browser menu to install the app');q('lock').onclick=()=>{sessionStorage.removeItem('b4p_access');auth=false;render()};q('tabL').onclick=()=>{module='lam';render()};q('tabP').onclick=()=>{module='pouch';render()};q('compare').onclick=()=>{cmp[module]=!cmp[module];render()};if(module==='lam'){bindL(0);if(cmp.lam)bindL(1)}else{bindP(0);if(cmp.pouch)bindP(1)}}q('closeQr').onclick=()=>q('qrModal').classList.remove('open');addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});document.documentElement.dataset.theme=localStorage.getItem('b4p_theme')||'dark';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
