<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIO4PACK</title><link rel="manifest" href="manifest.json"><style>:root{--b:#f3f6fa;--p:#fff;--p2:#f6f8fb;--l:#dce5ef;--t:#17243a;--g:#087f78;--bad:#fff0ef;--ok:#e8f8f1}html[data-theme=dark]{--b:#07111f;--p:#101d31;--p2:#0b1728;--l:#2d425f;--t:#f8fafc;--bad:#421f24;--ok:#12392d;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Segoe UI,Arial}button,input,select{font:inherit}.top{background:var(--p);padding:10px 4%;display:flex;gap:12px;align-items:center}.top img{width:145px;background:#fff;padding:5px}.top h2{margin:0;flex:1}.btn{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:9px;padding:9px;font-weight:800}.page{max-width:1450px;margin:auto;padding:16px}.tabs button{padding:10px 24px;border:0;border-radius:9px;font-weight:900}.on{background:var(--g);color:#fff}.work{display:flex;justify-content:space-between}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.single{grid-template-columns:1fr}.card{background:var(--p);border:1px solid var(--l);border-radius:15px;overflow:hidden}.head{background:linear-gradient(90deg,#16566a,var(--g));padding:13px;color:#fff;font-weight:900}.body{padding:13px}.grid,.outs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.f,.r{background:var(--p2);border:1px solid var(--l);border-radius:9px;padding:8px}.f label,.r small{display:block;font-size:9px}.f input,.f select{width:100%;height:33px;border:0;background:transparent;color:var(--t)}.note,.state{padding:9px;border-radius:8px;margin-top:8px}.note{background:#735d1938}.state{background:var(--bad)}.good{background:var(--ok)}.r b{display:block;font-size:17px}.price{background:#061226;color:#fff;text-align:center;border-radius:12px;margin-top:8px;padding:12px}.price b{display:block;font-size:30px}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(430px,93vw);background:var(--p);padding:25px;border-radius:16px}.box img{width:100%;max-height:85px;object-fit:contain}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center}.modal.show{display:grid}.modal>div{background:var(--p);padding:18px;text-align:center}.modal img{width:210px}@media(max-width:850px){.cards{grid-template-columns:1fr}.grid,.outs{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.outs{grid-template-columns:1fr}}</style></head><body><div id="root"></div><div id="modal" class="modal"><div><h3>Install BIO4PACK</h3><img src="qr-code-v16.png"><p><button id="close" class="btn">Close</button></p></div></div><script>let D,mod='lam',cmp=false,auth=sessionStorage.ok,installPrompt;const $=x=>document.getElementById(x),N=x=>parseFloat(x)||0,F=(x,d=2)=>N(x).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});let S=[{lam:'648',th:53,w:'',qty:'',pr:'Printed',col:'1-2',sku:1,gp:0,type:'SUP with zipper',h:100,pw:100,amt:''},{lam:'648W',th:63,w:'',qty:'',pr:'Printed',col:'3-4',sku:1,gp:0,type:'Open pouch',h:100,pw:100,amt:''}];function fld(id,l,v,a){return `<div class=f><label>${l}</label>${a?`<select id=${id}>${a.map(x=>`<option ${String(x)==String(v)?'selected':''}>${x}</option>`).join('')}</select>`:`<input id=${id} value="${v}">`}</div>`}function near(a,s){return a.reduce((b,r)=>!b||s(r)<s(b)?r:b,null)}function exact(x,p){return D[p?'pouchRows':'lamRows'].some(r=>String(r.Laminate).trim()==x.lam&&N(r[p?'Thickness (µ)':'Total Thickness (µ)'])==N(x.th))}function card(i){let x=S[i],p=mod==='pouch',ins=p?fld('type'+i,'Pouch Type',x.type,['SUP with zipper','Zipper pouch','Open pouch'])+fld('lam'+i,'Laminate',x.lam,D.allowedLaminates)+fld('th'+i,'Thickness (µm)',x.th,D.laminates[x.lam])+fld('h'+i,'Bag Height (mm)',x.h)+fld('pw'+i,'Bag Width (mm)',x.pw)+fld('amt'+i,'Amount (bags)',x.amt):fld('lam'+i,'Laminate',x.lam,D.allowedLaminates)+fld('th'+i,'Total Thickness (µm)',x.th,D.laminates[x.lam])+fld('w'+i,'Width (mm)',x.w)+fld('qty'+i,'Total Quantity (m)',x.qty);ins+=fld('pr'+i,'Printing',x.pr,['Printed','Not Printed'])+(x.pr==='Printed'?fld('col'+i,'Colors',x.col,['1-2','3-4','5-8'])+fld('sku'+i,'No. of SKUs',x.sku,[1,2,3,4,5,6,7,8]):'')+fld('gp'+i,'Additional Gross Profit %',x.gp);return `<article class=card><div class=head>${p?'Pouch ':''}Calculator ${i+1} · ${x.lam}</div><div class=body><div class=grid>${ins}</div>${x.pr==='Printed'?'<div class=note>Printing plates are not included. Each plate costs €350.</div>':''}<div class=note>Shipping Terms: EXW. Producer: Marma.</div><div id=o${i} class=outs></div><div id=s${i} class=state>Enter inputs</div><div class=price>${p?'PRICE PER POUCH':'SELL PRICE PER KG'}<b id=f${i}>-</b></div></div></article>`}function miss(i,p){$('o'+i).innerHTML='';$('s'+i).textContent='This thickness is listed, but no exact static '+(p?'pouch':'laminate')+' scenario exists. Price is not estimated.';$('f'+i).textContent='-'}function show(i,r){$('o'+i).innerHTML=r?r.vals.map(x=>`<div class=r><small>${x[0]}</small><b>${x[1]}</b></div>`).join(''):'';$('s'+i).className='state '+(r&&r.ok?'good':'');$('s'+i).textContent=r?(r.ok?'✓ MOQ reached':'Below MOQ'):'Enter inputs';$('f'+i).textContent=r?r.final:'-'}function calc(i){let x=S[i],p=mod==='pouch';if(!exact(x,p))return miss(i,p);if(p){if(!N(x.amt))return show(i);let a=D.pouchRows.filter(r=>String(r.Laminate).trim()==x.lam&&N(r['Thickness (µ)'])==N(x.th)&&String(r['Pouch Type']).toLowerCase()==x.type.toLowerCase()&&r['PR / NonPR']==x.pr&&(x.pr!=='Printed'||(String(r.Colors)==x.col&&N(r.SKUs)==N(x.sku)))),r=near(a,r=>Math.abs(N(r['Bag Height (mm)'])-N(x.h))+Math.abs(N(r['Amount (bags)'])-N(x.amt))/10000);if(!r)return show(i);let q=N(r['Price / Bag (€)'])/Math.max(.01,1-N(x.gp)/100);show(i,{vals:[['Bag MOQ',F(r['Bag MOQ'],0)],['Price / Bag','€'+F(q,4)],['Total Order','€'+F(q*N(x.amt))],['B4P / 1,000','€'+F(q*1000)]],final:'€'+F(q,4),ok:N(x.amt)>=N(r['Bag MOQ'])})}else{if(!N(x.w)||!N(x.qty))return show(i);let a=D.lamRows.filter(r=>String(r.Laminate).trim()==x.lam&&N(r['Total Thickness (µ)'])==N(x.th)&&r['PR / NonPR']==x.pr&&(x.pr!=='Printed'||(String(r.Colors)==x.col&&N(r.SKUs)==N(x.sku)))),r=near(a,r=>Math.abs(N(r['Width Asked (mm)'])-N(x.w))+Math.abs(N(r['Laminate Length (m)'])-N(x.qty))/1000);if(!r)return show(i);let kgm=N(r['Total KG'])/N(r['Laminate Length (m)']),sm=N(r['Sell Price / m (€)'])/Math.max(.01,1-N(x.gp)/100),kg=N(x.qty)*kgm;show(i,{vals:[['Calculated Length',F(x.qty,0)+' m'],['Calculated Weight',F(kg)+' kg'],['Total Sell','€'+F(sm*N(x.qty))],['B4P / 1,000m','€'+F(sm*1000)]],final:'€'+F(sm/kgm),ok:kg>=N(r['KG MOQ'])})}}function bind(i){let x=S[i];document.querySelectorAll(`.card:nth-child(${i+1}) input,.card:nth-child(${i+1}) select`).forEach(e=>e.onchange=e.oninput=()=>{let k=e.id.replace(/\d+$/,''),map={lam:'lam',th:'th',w:'w',qty:'qty',pr:'pr',col:'col',sku:'sku',gp:'gp',type:'type',h:'h',pw:'pw',amt:'amt'};x[map[k]]=e.value;if(k==='lam'){x.th=D.laminates[x.lam][0];render()}else if(k==='pr'){if(x.pr==='Not Printed'){x.col='0';x.sku=0}else{x.col='1-2';x.sku=1}render()}else calc(i)});calc(i)}function login(){root.innerHTML=`<div class=login><div class=box><img src="bio4pack-logo-v16.png"><h1>BIO4PACK Pricing Suite</h1><input id=pwd type=password placeholder=Password style="width:100%;height:42px"><button id=unlock class=btn style="width:100%;margin-top:8px">Unlock Calculator</button><p id=err></p></div></div>`;unlock.onclick=()=>{if(pwd.value==='Success2026'){sessionStorage.ok=1;auth=1;render()}else err.textContent='Incorrect password'}}function render(){if(!auth)return login();root.innerHTML=`<header class=top><img src="bio4pack-logo-v16.png"><h2>BIO4PACK Pricing Suite</h2><button id=theme class=btn>Dark / Light</button><button id=qr class=btn>QR Code</button><button id=install class=btn>Install App</button><button id=lock class=btn>Lock</button></header><main class=page><div class=tabs><button id=tl class=${mod==='lam'?'on':''}>Laminates<
