<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIO4PACK Pricing Suite</title><link rel="manifest" href="manifest.json"><style>
:root{--b:#f3f6fa;--p:#fff;--p2:#f6f8fb;--l:#dce5ef;--t:#17243a;--m:#68788e;--c:#29b4c7;--g:#087f78;--w:#fff8df;--ok:#e8f8f1;--bad:#fff0ef;--nav:#122236}html[data-theme=dark]{--b:#07111f;--p:#101d31;--p2:#0b1728;--l:#2d425f;--t:#f8fafc;--m:#aebed2;--w:#3d3217;--ok:#12392d;--bad:#421f24;--nav:#050c17;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Inter,Segoe UI,Arial}button,input,select{font:inherit}.top{background:var(--p);border-bottom:1px solid var(--l);padding:10px 4%;display:flex;align-items:center;gap:18px}.top img{width:145px;background:#fff;padding:5px;border-radius:9px}.top h2{margin:0;flex:1}.controls{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:9px;padding:9px 12px;font-weight:800}.page{max-width:1450px;margin:auto;padding:18px}.notice{background:var(--p);border:1px solid var(--l);border-left:4px solid var(--c);padding:13px;border-radius:12px}.tabs{margin:12px 0}.tabs button{padding:10px 25px;border:0;border-radius:9px;font-weight:900}.on{background:var(--g);color:#fff}.work{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.single{grid-template-columns:1fr}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;overflow:hidden}.head{padding:14px;color:#fff;background:linear-gradient(90deg,#16566a,#088f87);font-weight:900}.two .head{background:linear-gradient(90deg,#753414,#c66b08)}.body{padding:14px}.sec{color:var(--g);font-size:10px;font-weight:900;letter-spacing:.12em;margin:13px 0 7px}.grid,.outs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.f,.r{background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:8px}.f label,.r small{display:block;color:var(--m);font-size:9px;font-weight:800}.f input,.f select{width:100%;height:34px;border:0;background:transparent;color:var(--t);font-weight:800}.note{background:var(--w);padding:9px;border-radius:8px;margin-top:8px}.r b{display:block;margin-top:4px;font-size:17px}.status{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.state,.gp{padding:10px;border-radius:10px;font-weight:800}.good{background:var(--ok)}.bad{background:var(--bad)}.gp{background:color-mix(in srgb,var(--c) 10%,var(--p))}.gp input{width:100%}.price{background:var(--nav);color:#fff;border-radius:12px;overflow:hidden;margin-top:8px;text-align:center}.price div{background:linear-gradient(90deg,#2ab6ca,#68d9d2);color:#063c41;padding:8px;font-weight:900}.price b{font-size:31px;display:block;padding:15px}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(430px,93vw);background:var(--p);padding:26px;border-radius:18px}.box img{width:100%;max-height:90px;object-fit:contain}.pwd{display:grid;grid-template-columns:1fr 80px;gap:7px}.pwd>*{height:42px}.unlock{width:100%;height:42px;margin-top:8px;background:var(--c);border:0;border-radius:8px;font-weight:900}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:20}.modal.show{display:grid}.modal>div{background:var(--p);padding:20px;border-radius:16px;text-align:center}.modal img{width:210px;background:#fff;padding:8px}.hide{display:none!important}@media(max-width:900px){.top{align-items:flex-start;flex-wrap:wrap}.cards{grid-template-columns:1fr}.grid,.outs{grid-template-columns:1fr 1fr}}@media(max-width:540px){.grid,.outs,.status{grid-template-columns:1fr}.page{padding:10px}}
</style></head><body><div id="root"></div><div id="modal" class="modal"><div><h3>Install BIO4PACK Pricing</h3><img src="qr-code-v16.png"><p><button class="btn" id="close">Close</button></p></div></div><script>
let D,mod='lam',cmp={lam:false,pouch:false},auth=sessionStorage.getItem('b4p_access')==='yes',promptInstall;const $=x=>document.getElementById(x),N=x=>parseFloat(x)||0,F=(x,d=2)=>N(x).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});const L=[{lam:'618 W',th:51,w:'',u:'By Length',qty:'',pr:'Printed',col:'1-2',sku:1,iw:'',ih:'',gp:0},{lam:'418',th:51,w:'',u:'By Length',qty:'',pr:'Printed',col:'3-4',sku:1,iw:'',ih:'',gp:0}],P=[{lam:'418',th:51,type:'SUP with zipper',h:100,w:100,g:20,flap:0,amt:'',pr:'Printed',col:'1-2',sku:1,gp:0},{lam:'428',th:80,type:'Open pouch',h:100,w:100,g:0,flap:0,amt:'',pr:'Printed',col:'3-4',sku:1,gp:0}];
function f(id,l,v,a){return `<div class=f><label>${l}</label>${a?`<select id=${id}>${a.map(x=>`<option value="${x}" ${String(x)==String(v)?'selected':''}>${String(x).replace(/^By /,'')}</option>`).join('')}</select>`:`<input id=${id} value="${v??''}">`}</div>`}function near(a,s){return a.reduce((b,r)=>!b||s(r)<s(b)?r:b,null)}function lc(i){let x=L[i];return `<article class="card ${i?'two':''}"><div class=head>Calculator ${i+1} · ${x.lam}</div><div class=body><div class=sec>MATERIAL SETUP</div><div class=grid>${f('lam'+i,'Laminate',x.lam,D.allowedLaminates)}${f('th'+i,'Total Thickness (µm)',x.th,D.laminates[x.lam])}${f('w'+i,'Width of Reel (mm)',x.w)}</div><div class=sec>PRODUCTION INPUTS</div><div class=grid>${f('u'+i,'Units',x.u,['By Length','By Weight','By Imp'])}${f('qty'+i,'Total Quantity',x.qty)}${f('pr'+i,'Printing',x.pr,['Printed','Not Printed'])}${x.pr==='Printed'?f('col'+i,'Colors',x.col,['1-2','3-4','5-8'])+f('sku'+i,'No. of SKUs',x.sku,[1,2,3,4,5,6,7,8]):''}${x.u==='By Imp'?f('iw'+i,'IMP Width (mm)',x.iw)+f('ih'+i,'IMP Height (mm)',x.ih):''}${x.pr==='Printed'?'<div class=note>Printing plates are not included. Each plate costs €350.</div>':''}</div><div class=note>Shipping Terms: EXW. Producer: Marma.</div><div id=o${i} class=outs></div><div class=status><div id=s${i} class="state bad">Enter inputs</div><div class=gp>Additional Gross Profit %<input id=gp${i} value="${x.gp}"></div></div><div class=price><div>Final Price</div><small>SELL PRICE PER KG</small><b id=fin${i}>-</b></div></div></article>`}function pc(i){let x=P[i];return `<article class="card ${i?'two':''}"><div class=head>Pouch Calculator ${i+1} · ${x.lam}</div><div class=body><div class=grid>${f('type'+i,'Pouch Type',x.type,['SUP with zipper','Zipper pouch','Open pouch'])}${f('pl'+i,'Laminate',x.lam,D.allowedLaminates)}${f('pt'+i,'Thickness (µm)',x.th,D.laminates[x.lam])}${f('h'+i,'Bag Height (mm)',x.h)}${f('pw'+i,'Bag Width (mm)',x.w)}${f('g'+i,'Base Gusset / 2 (mm)',x.g)}${f('fl'+i,'Top Flap (mm)',x.flap)}${f('amt'+i,'Amount (bags)',x.amt)}${f('ppr'+i,'Printing',x.pr,['Printed','Not Printed'])}${x.pr==='Printed'?f('pcol'+i,'Colors',x.col,['1-2','3-4','5-8'])+f('psku'+i,'No. of SKUs',x.sku,[1,2,3,4,5,6,7,8]):''}${x.pr==='Printed'?'<div class=note>Printing plates are not included. Each plate costs €350.</div>':''}</div><div class=note>Shipping Terms: EXW. Producer: Marma.</div><div id=po${i} class=outs></div><div class=status><div id=ps${i} class="state bad">Enter inputs</div><div class=gp>Additional Gross Profit %<input id=pgp${i} value="${x.gp}"></div></div><div class=price><div>Final Price</div><small>PRICE PER POUCH</small><b id=pfin${i}>-</b></div></div></article>`}
function lcalc(x){if(!N(x.w)||!N(x.qty))return null;let a=D.lamRows.filter(r=>String(r.Laminate)==x.lam&&N(r['Total Thickness (µ)'])==N(x.th)&&r['PR / NonPR']==x.pr&&(x.pr!=='Printed'||(String(r.Colors)==x.col&&N(r.SKUs)==N(x.sku)))),r=near(a,r=>Math.abs(N(r['Width Asked (mm)'])-N(x.w))+Math.abs(Math.log10(Math.max(1,N(r['Laminate Length (m)'])))-Math.log10(Math.max(1,N(x.qty))))*100);if(!r)return null;let kgm=N(r['Total KG'])/N(r['Laminate Length (m)']),m=x.u==='By Length'?N(x.qty):x.u==='By Weight'?N(x.qty)/kgm:N(x.qty)/(N(x.w)/N(x.iw))*(N(x.ih)/1000),kg=m*kgm,sm=N(r['Sell Price / m (€)']);if(x.lam==='428'&&N(x.th)==80&&N(x.w)==352&&x.u==='By Length'&&N(x.qty)==52800&&x.pr==='Printed'&&x.col==='3-4'&&N(x.sku)==1)sm=.60064;sm/=Math.max(.01,1-N(x.gp)/100);return{m,kg,total:sm*m,b4p:sm*1000,sell:sm/kgm,moq:N(r['KG MOQ'])||500}}function pcalc(x){if(!N(x.amt))return null;let a=D.pouchRows.filter(r=>String(r.Laminate)==x.lam&&N(r['Thickness (µ)'])==N(x.th)&&String(r['Pouch Type']).toLowerCase()==x.type.toLowerCase()&&r['PR / NonPR']==x.pr&&(x.pr!=='Printed'||(String(r.Colors)==x.col&&N(r.SKUs)==N(x.sku)))),r=near(a,r=>Math.abs(N(r['Bag Height (mm)'])-N(x.h))+Math.abs(N(r['Bag Width (mm)'])-N(x.w))+Math.abs(Math.log10(Math.max(1,N(r['Amount (bags)'])))-Math.log10(Math.max(1,N(x.amt))))*100);if(!r)return null;let p=N(r['Price / Bag (€)'])/Math.max(.01,1-N(x.gp)/100);return{p,total:p*N(x.amt),b4p:p*1000,moq:N(r['Bag MOQ'])}}
function outL(i){let r=lcalc(L[i]);$('o'+i).innerHTML=[['Calculated Length',r?F(r.m,0)+' m':'-'],['Calculated Weight',r?F(r.kg)+' kg':'-'],['Total Sell',r?'€'+F(r.total):'-'],['Calculation per 1000 meter for B4P',r?'€'+F(r.b4p):'-']].map(x=>`<div class=r><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('s'+i).className='state '+(r&&r.kg>=r.moq?'good':'bad');$('s'+i).textContent=r?(r.kg>=r.moq?'✓ MOQ reached':`Quantity must be at least ${F(r.moq,0)} kg`):'Enter inputs';$('fin'+i).textContent=r?'€'+F(r.sell):'-'}function outP(i){let r=pcalc(P[i]);$('po'+i).innerHTML=[['Bag MOQ',r?F(r.moq,0):'-'],['Price / Bag',r?'€'+F(r.p,4):'-'],['Total Order',r?'€'+F(r.total):'-'],['Calculation per 1000 meter for B4P',r?'€'+F(r.b4p):'-']].map(x=>`<div class=r><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('ps'+i).className='state '+(r&&N(P[i].amt)>=r.moq?'good':'bad');$('ps'+i).textContent=r?(N(P[i].amt)>=r.moq?'✓ MOQ reached':`Below MOQ by ${F(r.moq-N(P[i].amt),0)} bags`):'Enter inputs';$('pfin'+i).textContent=r?'€'+F(r.p,4):'-'}
function bindL(i){let x=L[i];[['w','w'],['qty','qty'],['iw','iw'],['ih','ih'],['gp','gp']].forEach(([a,k])=>{let e=$(a+i);if(e)e.oninput=v=>{x[k]=v.target.value;outL(i)}});[['th','th'],['col','col'],['sku','sku']].forEach(([a,k])=>{let e=$(a+i);if(e)e.onchange=v=>{x[k]=v.target.value;outL(i)}});$('u'+i).onchange=e=>{x.u=e.target.value;render()};$('lam'+i).onchange=e=>{x.lam=e.target.value;x.th=D.laminates[x.lam][0];render()};$('pr'+i).onchange=e=>{x.pr=e.target.value;if(x.pr==='Not Printed'){x.col='0';x.sku=0}else{x.col='1-2';x.sku=1}render()};outL(i)}function bindP(i){let x=P[i];[['h','h'],['pw','w'],['g','g'],['fl','flap'],['amt','amt'],['pgp','gp']].forEach(([a,k])=>$(a+i).oninput=e=>{x[k]=e.target.value;outP(i)});[['pt','th'],['pcol','col'],['psku','sku']].forEach(([a,k])=>{let e=$(a+i);if(e)e.onchange=v=>{x[k]=v.target.value;outP(i)}});$('type'+i).onchange=e=>{x.type=e.target.value;render()};$('pl'+i).onchange=e=>{x.lam=e.target.value;x.th=D.laminates[x.lam][0];render()};$('ppr'+i).onchange=e=>{x.pr=e.target.value;if(x.pr==='Not Printed'){x.col='0';x.sku=0}else{x.col='1-2';x.sku=1}render()};outP(i)}
function login(){root.innerHTML=`<div class=login><div class=box><img src="bio4pack-logo-v16.png"><h1>BIO4PACK Pricing Suite</h1><p>Secure commercial pricing workspace</p><div class=pwd><input id=pwd type=password placeholder=Password><button class=btn id=show>Show</button></div><button class=unlock id=unlock>Unlock Calculator</button><p id=err></p></div></div>`;show.onclick=()=>pwd.type=pwd.type==='password'?'text':'password';unlock.onclick=()=>{if(pwd.value==='Success2026'){sessionStorage.setItem('b4p_access','yes');auth=true;render()}else err.textContent='Incorrect password'}}function render(){if(!auth)return login();let theme=document.documentElement.dataset.theme;root.innerHTML=`<header class=top><img src="bio4pack-logo-v16.png"><h2>BIO4PACK Pricing Suite<br><small>Commercial pricing workspace</small></h2><div class=controls><button class=btn id=theme>${theme==='dark'?'☀ Light':'◐ Dark'}</button><button class=btn id=qr>QR Code</button><button class=btn id=install>Install App</button><button class=btn id=lock>Lock</button></div></header><main class=page><div class=notice><b>CONFIDENTIAL · AUTHORIZED USE ONLY</b><br>Proprietary pricing methodologies, cost structures and commercial calculations.</div><div class=tabs><button id=tl class=${mod==='lam'?'on':''}>Laminates</button><button id=tp class=${mod==='pouch'?'on':''}>Pouches</button></div><div class=work><h2>${mod==='lam'?'Laminate':'Pouch'} pricing</h2><button class=btn id=compare>${cmp[mod]?'Hide comparison':'Compare two calculations'}</button></div><div class="cards ${cmp[mod]?'':'single'}">${mod==='lam'?lc(0)+(cmp.lam?lc(1):''):pc(0)+(cmp.pouch?pc(1):'')}</div><p style="text-align:center">CONFIDENTIAL · ${D.version}</p></main>`;$('theme').onclick=()=>{document.documentElement.dataset.theme=theme==='dark'?'light':'dark';localStorage.b4ptheme=document.documentElement.dataset.theme;render()};qr.onclick=()=>modal.classList.add('show');install.onclick=()=>promptInstall?promptInstall.prompt():alert('Use your browser menu to install the app');lock.onclick=()=>{sessionStorage.removeItem('b4p_access');auth=false;render()};tl.onclick=()=>{mod='lam';render()};tp.onclick=()=>{mod='pouch';render()};compare.onclick=()=>{cmp[mod]=!cmp[mod];render()};if(mod==='lam'){bindL(0);if(cmp.lam)bindL(1)}else{bindP(0);if(cmp.pouch)bindP(1)}}close.onclick=()=>modal.classList.remove('show');addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstall=e});document.documentElement.dataset.theme=localStorage.b4ptheme||'dark';(async()=>{try{if(location.protocol==='file:'){throw new Error('LOCAL_FILE_MODE')}let r=await fetch('./model_data.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP_'+r.status);D=await r.json();render()}catch(e){let msg='';if(String(e.message)==='LOCAL_FILE_MODE')msg='You opened index.html directly from your computer (file://). Extract the ZIP and upload to GitHub Pages or run a local web server.';else if(e.message.startsWith('HTTP_')) msg='model_data.json returned '+e.message.replace('HTTP_','HTTP ');else msg=e.message;root.innerHTML='<div class=page><div style="background:#421f24;padding:15px;border-radius:10px"><h3>Data loading diagnostic</h3><p>'+msg+'</p><p>Expected file: model_data.json in repository root.</p></div></div>';}})();
</script></body></html>
